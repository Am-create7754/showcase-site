name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs (comment shows the release) so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Unit, security and header tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Bundle check (secrets, source maps, env refs, inline scripts)
        run: npm run check:bundle
      - name: Dependency audit (production, high and above)
        run: npm run audit:prod
